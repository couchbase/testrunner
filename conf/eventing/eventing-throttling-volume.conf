# Eventing KV-throttling pass (concurrent-handler volume).
# Throttle levels:
#   baseline:   throttle_enabled=false
#   generous:   throttle_enabled=true,node_capacity=5000,bucket_throttle_reserved=1000,bucket_throttle_hard_limit=3000,throttle_timeout_multiplier=2
#   aggressive: throttle_enabled=true,node_capacity=600,bucket_throttle_reserved=75,bucket_throttle_hard_limit=150,throttle_timeout_multiplier=8
# Hard limit is per bucket across the whole cluster, not per node.
# Limits are sized on billed units; Eventing's DCP reads are not billed, so only
# the loader's and handlers' KV ops are throttled.
# All levels run at doc-per-day=100: at 1000, aggressive would take ~57h.
eventing.eventing_volume.EventingVolume:
    test_eventing_volume_concurrent_handlers_create_delete_mutations,nodes_init=6,services_init=kv-kv-kv-eventing-eventing-index:n1ql,dataset=default,groups=simple,reset_services=True,doc-per-day=100,java_sdk_client=True,bucket_size=512
    test_eventing_volume_concurrent_handlers_with_fewer_nodes,nodes_init=6,services_init=kv-kv-kv:eventing-eventing-eventing-index:n1ql,dataset=default,groups=simple,reset_services=True,doc-per-day=100,java_sdk_client=True,bucket_size=512,num_nodes_running=2
