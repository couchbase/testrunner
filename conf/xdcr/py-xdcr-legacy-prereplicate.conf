xdcr.legacyPreReplicateXDCR.LegacyPreReplicateXDCR:
    # MB-71545: checkpoint resume with the goxdcr internal setting
    # UseLegacyPreReplicate=true, which validates checkpoints through the
    # target's _pre_replicate endpoint as before 8.1. Needs two nodes in each
    # cluster (the failover case fails one target node over), e.g.
    # b/resources/6-nodes-template-xdcr.ini
    test_resume_after_pause,rdirection=unidirection,ctopology=chain,items=10000,GROUP=P0
    # Control: the default (local) path must send the target no _pre_replicate calls
    test_resume_after_pause,rdirection=unidirection,ctopology=chain,items=10000,legacy_prereplicate=False,GROUP=P0
    test_target_flush_while_paused,rdirection=unidirection,ctopology=chain,items=10000,GROUP=P0
    test_switch_prereplicate_mode,rdirection=unidirection,ctopology=chain,items=10000,legacy_prereplicate=False,GROUP=P0
    test_switch_prereplicate_mode,rdirection=unidirection,ctopology=chain,items=10000,legacy_prereplicate=True,GROUP=P1
    test_resume_after_goxdcr_crash,rdirection=unidirection,ctopology=chain,items=10000,GROUP=P1
    test_target_failover_during_replication,rdirection=unidirection,ctopology=chain,items=10000,GROUP=P1
    # The default path must reject stale checkpoints too
    test_target_flush_while_paused,rdirection=unidirection,ctopology=chain,items=10000,legacy_prereplicate=False,GROUP=P1
    # Guards the measure the resume tests depend on: it must see a restream from seqno 0
    test_restream_is_detected,rdirection=unidirection,ctopology=chain,items=10000,GROUP=P1
