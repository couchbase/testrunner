# XDCR under KV data-service rate limiting (Totoro / 8.5, MB-64385, CBQE-8920)
# Needs an Enterprise 8.5 build and two 2-node clusters:
#   b/resources/6-nodes-template-xdcr.ini
# rl_hard_limit and rl_reserved are units/s per node (1 WU = 1024 B written,
# 1 RU = 4096 B read); value_size=512 keeps every doc at one unit a side.
# Limits are set from the test, per cluster, so rows do not use the shared
# infra params (node_capacity, throttle_enabled, bucket_throttle_*), which
# would throttle every cluster alike.

xdcr.rateLimitXDCR.RateLimitXDCR:

    ############################################################################
    # P0: XDCR is throttled, converges, and the units land on the right bucket
    ############################################################################
    test_source_throttled_backfill,items=20000,value_size=512,rl_hard_limit=200,GROUP=P0
    test_target_throttled_backfill,items=20000,value_size=512,rl_hard_limit=200,GROUP=P0
    test_client_load_with_replication_throttled,items=20000,value_size=512,rl_hard_limit=500,rl_dest_hard_limit=200,update=C1,delete=C1,upd=30,del=30,GROUP=P0
    test_units_counted_with_throttling_disabled,items=20000,value_size=512,GROUP=P0
    test_backfill_charges_source_bucket_units,items=20000,value_size=512,rl_hard_limit=200,GROUP=P0

    ############################################################################
    # P1: dynamics, free-pool isolation, bidirectional, pause/resume, soak
    ############################################################################
    test_toggle_throttling_mid_replication,items=5000,value_size=512,rl_hard_limit=100,rl_second_hard_limit=300,GROUP=P1
    test_free_pool_isolation,items=20000,value_size=512,standard_buckets=1,rl_reserved=50,rl_free_pool=50,rl_reserved_b=1000000,GROUP=P1
    test_bidirectional_throttled,items=10000,value_size=512,rdirection=bidirection,rl_hard_limit=500,update=C1-C2,delete=C1-C2,GROUP=P1
    test_pause_resume_throttled,items=20000,value_size=512,rl_hard_limit=100,pause_secs=60,GROUP=P1
    test_target_throttle_soak,items=3000,value_size=512,rl_hard_limit=5,soak_secs=600,soak_window_secs=60,GROUP=P1
