# CBSE-23458: broken_mappings.py (goxdcr change 254675) patches metakv to remove a stuck broken
# collection mapping. 8.0.x and later, totoro included. 7.6.x has no variable vbuckets: use
# py-xdcr-brokenmap-patch-7.6.conf there.
# INI: b/resources/6-nodes-template-xdcr-3x3-kv.ini (3 source + 3 target KV nodes).
# Every row needs brokenmap_script (default tmp/cbse23458/broken_mappings.py) and default_bucket=False.
#   non-variable VB: magma 128 -> magma 128, couchstore 1024 -> couchstore 1024
#   variable VB:     magma 128 -> couchstore 1024, couchstore 1024 -> magma 128 (CB_ENABLE_VARVB + python-snappy)
# GROUP=unfixed rows induce MB-73479's false positive, reproducible only on builds without its
# fix (8.0.x); do not run them on totoro.
xdcr.brokenMappingPatchXDCR.BrokenMappingPatchXDCR:
    # scenario 1 + setup 3: patch, create the missing collection while paused, docs replicate after
    test_patch_clears_broken_mapping,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P0
    test_patch_clears_broken_mapping,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=couchstore,variable_vb=True,GROUP=P0
    test_patch_clears_broken_mapping,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=couchstore,dest_storage=couchstore,variable_vb=False,GROUP=P1
    test_patch_clears_broken_mapping,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=couchstore,dest_storage=magma,dest_vbuckets=128,variable_vb=True,GROUP=P1
    # scenario 2: same-named and differently named targets (a missing scope too), then create them
    test_patch_same_and_different_then_create_missing,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P0
    test_patch_same_and_different_then_create_missing,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=couchstore,variable_vb=True,GROUP=P0
    test_patch_same_and_different_then_create_missing,rdirection=unidirection,ctopology=chain,default_bucket=False,mapping=implicit,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P1
    # scenario 3: restore mode
    test_restore_undoes_patch,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P0
    test_restore_undoes_patch,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=couchstore,variable_vb=True,GROUP=P0
    # scenario 4: main and backfill pipeline both broken
    test_main_and_backfill_broken_patch,rdirection=unidirection,ctopology=chain,default_bucket=False,mapping=implicit,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P0
    test_main_and_backfill_broken_patch,rdirection=unidirection,ctopology=chain,default_bucket=False,mapping=implicit,src_storage=magma,src_vbuckets=128,dest_storage=couchstore,variable_vb=True,GROUP=P0
    test_main_and_backfill_broken_patch,rdirection=unidirection,ctopology=chain,default_bucket=False,mapping=implicit,src_storage=couchstore,dest_storage=magma,dest_vbuckets=128,variable_vb=True,GROUP=P1
    # the patch must not hide a broken mapping that is still real
    test_patch_does_not_mask_genuine,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P0
    # the script's refusals: running replication, no backup, existing backup, variable VB without CB_ENABLE_VARVB
    test_script_guardrails,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=P1
    test_script_guardrails,rdirection=unidirection,ctopology=chain,default_bucket=False,src_storage=magma,src_vbuckets=128,dest_storage=couchstore,variable_vb=True,GROUP=P1
    # scenario 1 on the customer's actual state: MB-73479's stuck false positive (8.0.x only)
    test_patch_clears_broken_mapping,rdirection=unidirection,ctopology=chain,default_bucket=False,induce=false_positive,src_storage=magma,src_vbuckets=128,dest_storage=magma,dest_vbuckets=128,variable_vb=False,GROUP=unfixed
    test_patch_clears_broken_mapping,rdirection=unidirection,ctopology=chain,default_bucket=False,induce=false_positive,induce_rounds=6,src_storage=magma,src_vbuckets=128,dest_storage=couchstore,variable_vb=True,GROUP=unfixed
