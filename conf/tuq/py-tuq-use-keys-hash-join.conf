    test_use_keys_both_sides_no_match,skip_load=True,default_bucket=True,GROUP=P0
    test_use_keys_both_sides_single_key_each,skip_load=True,default_bucket=True,GROUP=P0
    test_forced_hash_join_with_use_keys_plan,skip_load=True,default_bucket=True,GROUP=P0
    test_forced_hash_join_with_use_keys_correct_results,skip_load=True,default_bucket=True,GROUP=P0
