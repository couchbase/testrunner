# GSI KV-throttling pass (rebalance and failover).
# Throttle levels:
#   baseline:   throttle_enabled=false
#   generous:   throttle_enabled=true,node_capacity=32000,bucket_throttle_reserved=8000,bucket_throttle_hard_limit=16000
#   aggressive: throttle_enabled=true,node_capacity=8000,bucket_throttle_reserved=150,bucket_throttle_hard_limit=300,throttle_timeout_multiplier=10
# Limits are sized on billed units; projector DCP is throttled but not billed.
# Run one set per job (-p GROUP=SETn); each set fits 12h at aggressive.

gsi.gsi_rebalance_gsi.SecondaryIndexingRebalanceTests:
    test_gsi_rebalance_works_when_mutations_are_in_progress,doc-per-day=1000,dataset=array,nodes_init=3,services_init=kv-index-n1ql,groups=simple,reset_services=True,GROUP=SET1
