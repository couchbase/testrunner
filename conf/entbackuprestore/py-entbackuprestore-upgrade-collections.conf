# Collections-aware backup/restore across an upgrade: back up with the old cbbackupmgr,
# upgrade, restore with the new one into the upgraded cluster and a fresh node.
# Needs param upgrade_version (e.g. -p upgrade_version=8.5.0-1257) and 3 servers
# ([servers]); with restore_to_fresh_cluster=False 2 servers are enough.
# No 7.1.x start version: a direct upgrade from 7.1.x to 8.5 is not supported (7.2.0 or newer
# is required), the package pre-install script rejects it.
# upgrade_type is offline (default) or failover_full_recovery.
# test_export_import_after_upgrade needs 2 servers: cbexport/cbimport content and a gross
# export-time ceiling (export_slowdown_factor x old time, min export_floor_secs) across the upgrade.
