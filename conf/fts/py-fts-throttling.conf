# FTS coverage for KV rate-limiting (8.5+, Totoro) - MB-70229.
#
# DCP readers are not exempt from throttling, and FTS builds its indexes by
# consuming DCP from KV. Each row builds the same index twice: once with
# throttling off to get a reference build time, then again under the bucket
# limits set below. The limit counts as enforced if throttle_count_total
# moves or the build is at least throttle_slowdown_factor slower.
#
# Limits are fixed here rather than derived from a measured RU/WU baseline.
# That is how every other throttling suite works - TAF epengine
# rate_limiting_tests, testrunner fts|gsi/serverless/throttling,
# tuqquery/tuq_throttling all set a known limit and drive work past it - and
# the baseline approach cannot work for FTS anyway: on 8.5.0-1257 a complete
# 100k document index build left ru_total at 0 while the client load moved
# wu_total by exactly 100000, so FTS's DCP reads are not metered into the
# bucket's read units.
#
# Param names match the TAF suites so conf rows port over unchanged:
#   node_capacity, bucket_throttle_reserved, bucket_throttle_hard_limit
# Tunables: throttle_slowdown_factor, throttled_timeout_factor,
#   index_stall_window, reference_build_timeout, bucket_throttle_enabled.

fts.fts_throttling.FTSThrottling:

    # Core pass - the limits TAF's own rate_limiting_steady_state.conf uses
    test_fts_index_build_under_throttling,items=100000,cluster=D,F,F,node_capacity=500,bucket_throttle_reserved=100,bucket_throttle_hard_limit=200,GROUP=P0;THROTTLING

    # Tighter still, to push into rejection territory
    test_fts_index_build_under_throttling,items=100000,cluster=D,F,F,node_capacity=500,bucket_throttle_reserved=50,bucket_throttle_hard_limit=100,GROUP=P0;THROTTLING

    # Storage backends - magma is the FTS default, couchstore for contrast
    test_fts_index_build_under_throttling,items=100000,cluster=D,F,F,bucket_storage=magma,node_capacity=500,bucket_throttle_reserved=100,bucket_throttle_hard_limit=200,GROUP=P0;THROTTLING;MAGMA
    test_fts_index_build_under_throttling,items=100000,cluster=D,F,F,bucket_storage=couchstore,node_capacity=500,bucket_throttle_reserved=100,bucket_throttle_hard_limit=200,GROUP=P1;THROTTLING

    # Two buckets, each reserving out of a single node capacity pool
    test_fts_index_build_under_throttling,items=50000,cluster=D,F,F,standard_buckets=1,node_capacity=500,bucket_throttle_reserved=100,bucket_throttle_hard_limit=200,GROUP=P1;THROTTLING

    # Collection scoped index
    test_fts_index_build_under_throttling,items=100000,cluster=D,F,F,scope=s1,collection=c1,node_capacity=500,bucket_throttle_reserved=100,bucket_throttle_hard_limit=200,GROUP=P1;THROTTLING;COLLECTIONS

    # Two KV nodes - settings fanned out and counters summed across both
    test_fts_index_build_under_throttling,items=100000,cluster=D,D,F,F,node_capacity=500,bucket_throttle_reserved=100,bucket_throttle_hard_limit=200,GROUP=P1;THROTTLING

    # Soft limit well below the hard limit: throttling by induced latency
    # rather than rejection
    test_fts_index_build_under_throttling,items=100000,cluster=D,F,F,node_capacity=20000,bucket_throttle_reserved=100,bucket_throttle_hard_limit=10000,GROUP=P1;THROTTLING
