# Three-node template carrying the Backup Service.
#
# Used by conf/backup_restore/crl_test.conf (nodes_init=3). Two nodes carry
# 'backup' because those tests revoke a FOLLOWER's certificate while the
# master's stays valid; _1 is left without it as the likely master. Most of
# that conf passes no services_init, so cluster.backup_nodes comes from the
# per-node `services:` lines below.
#
# ip:dynamic is filled in by scripts/populateIni.py at job time.

[global]
username:root
password:couchbase
port:8091
n1ql_port:8093
index_port:9102

data_path:/data/dta
index_path:/data/idx

[membase]
rest_username:Administrator
rest_password:password

[servers]
1:_1
2:_2
3:_3

[_1]
ip:dynamic
port:8091
services:kv,index,n1ql

[_2]
ip:dynamic
port:8091
services:kv,backup

[_3]
ip:dynamic
port:8091
services:kv,backup
